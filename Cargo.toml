[package]
name = "viedit"
version = "0.2.0"
edition = "2021"
description = "VieEdit - trinh bien tap video tieng Viet, viet bang Rust"
license = "MIT"
repository = "https://github.com/kyhaotool/viedit"
homepage = "https://github.com/kyhaotool/viedit"
readme = "README.md"
keywords = ["video", "editor", "egui", "rust", "vietnamese"]
categories = ["multimedia::video", "gui"]
rust-version = "1.75"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
